# Configures a bare Ubuntu box (created by terraform/) into a working k3s
# node: swap file, k3s itself, then fetches+rewrites the kubeconfig so local
# kubectl/helm can manage the cluster directly. See DESIGN.md's "Terraform /
# AWS deployment" section for the overall architecture.
- hosts: k3s_box
  become: true
  vars:
    # Pinned for reproducibility, same reasoning as the chart versions in
    # scripts/start-k8s.mjs - bump deliberately, not automatically.
    keda_chart_version: "2.20.2"
  tasks:
    # Swap must exist BEFORE k3s installs, not after - k3s's own startup
    # (pulling+starting containerd, coredns, the API server) is exactly the
    # moment memory pressure peaks on a 2GB box. Guarded by
    # ansible_swaptotal_mb so re-running the playbook doesn't recreate an
    # already-active swapfile.
    - name: Create 2GB swapfile
      ansible.builtin.command:
        cmd: fallocate -l 2G /swapfile
      when: ansible_facts['swaptotal_mb'] == 0

    - name: Set swapfile permissions
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"
      when: ansible_facts['swaptotal_mb'] == 0

    - name: Format swapfile as swap
      ansible.builtin.command:
        cmd: mkswap /swapfile
      when: ansible_facts['swaptotal_mb'] == 0

    - name: Enable swapfile
      ansible.builtin.command:
        cmd: swapon /swapfile
      when: ansible_facts['swaptotal_mb'] == 0

    - name: Persist swapfile in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"

    # Traefik disabled - not used, Caddy (installed separately, directly on
    # the host) handles ingress/TLS instead, so Traefik would just sit there
    # unused, competing for RAM on a 2GB box for no benefit.
    # --kubelet-arg=fail-swap-on=false is required: kubelet refuses to start
    # at all if it detects swap enabled, unless told explicitly to tolerate
    # it. --tls-san adds the public IP as a valid name on k3s's
    # self-signed API cert - without it, k3s only knows its own private VPC
    # IP/internal service IP/loopback, and kubectl from outside the VPC
    # fails TLS verification against the public IP.
    - name: Install k3s
      ansible.builtin.shell:
        cmd: curl -sfL https://get.k3s.io | sh -s - --disable traefik --kubelet-arg=fail-swap-on=false --tls-san {{ ansible_host }}
        creates: /usr/local/bin/k3s

    - name: Wait for k3s kubeconfig to be written
      ansible.builtin.wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        state: present

    # k3s writes its kubeconfig with server: https://127.0.0.1:6443, only
    # correct if kubectl runs on the box itself. Fetch it locally and
    # rewrite that address to the box's real public IP so local kubectl/helm
    # can manage this cluster directly from your own machine.
    - name: Fetch kubeconfig to local machine
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/kubeconfig-aws.yaml"
        flat: true

    - name: Rewrite kubeconfig server address to the box's public IP
      delegate_to: localhost
      become: false
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/kubeconfig-aws.yaml"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ ansible_host }}:6443"

    # KEDA's CRDs (ScaledJob/ScaledObject) must exist before k8s/ manifests
    # are applied. helm runs on the box itself, using k3s's own kubeconfig
    # (server: 127.0.0.1 is correct from here), so nothing depends on which
    # tools the machine running Ansible has.
    - name: Install helm
      ansible.builtin.shell:
        cmd: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        creates: /usr/local/bin/helm

    # The kubeconfig file is written slightly before k3s's API answers, so
    # wait for the node to be Ready before talking to it.
    - name: Wait for the k3s node to be Ready
      ansible.builtin.command:
        cmd: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false

    # upgrade --install (not plain install) so re-running the playbook
    # doesn't fail once the release exists. Longer --timeout than helm's
    # default 5m - KEDA's pods can be slow to settle on a small box.
    - name: Install KEDA
      ansible.builtin.shell:
        cmd: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm upgrade --install keda kedacore/keda --version {{ keda_chart_version }} --namespace keda --create-namespace --wait --timeout 10m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    # Official Caddy apt repo setup, chained as one shell task (same
    # curl-pipe pattern as the k3s install above) - guarded by `creates` so
    # re-running the playbook doesn't redo it.
    - name: Install Caddy
      ansible.builtin.shell:
        cmd: |
          apt install -y debian-keyring debian-archive-keyring apt-transport-https curl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
          apt update
          apt install -y caddy
        creates: /usr/bin/caddy

    # Copy (not create - trailing slash on src means "contents of dist/",
    # not "dist/ itself") the built frontend onto the box, to the path the
    # Caddyfile's `root` directive expects.
    - name: Copy built frontend to the box
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../frontend/dist/"
        dest: /var/www/frontend/

    # notify below means the handler only fires if this task actually
    # changed the file - not on every single playbook run.
    - name: Render Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: /etc/caddy/Caddyfile
      notify: Restart caddy

    - name: Enable Caddy service
      ansible.builtin.systemd:
        name: caddy
        state: started
        enabled: true

  handlers:
    - name: Restart caddy
      ansible.builtin.systemd:
        name: caddy
        state: restarted
