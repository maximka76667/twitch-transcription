[ssh_connection]
# accept-new: trust a host the first time it's seen (so a freshly created box
# doesn't need a manual "ssh in and type yes"), but still refuse if a known
# host's key changes. Setting ssh_args replaces Ansible's defaults, so the
# default options (compression, connection reuse) are repeated here.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
