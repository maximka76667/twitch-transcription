apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: twitch-transcription
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
    spec:
      containers:
        - name: ingest
          image: twitch-transcription-ingest:local
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka:9092
            - name: REDIS_HOST
              value: redis
            - name: CHUNK_SECONDS
              value: "4"
