apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# transcriber and api are standard Deployments - Kustomize's image matcher
# finds spec.template.spec.containers[].image automatically.
images:
  - name: twitch-transcription-transcriber
    newName: max76667/twitch-transcription-transcriber
    newTag: c14688a
  - name: twitch-transcription-api
    newName: max76667/twitch-transcription-api
    newTag: c14688a

# ingest's image lives inside a KEDA ScaledJob at
# spec.jobTargetRef.template.spec.containers[] - not the standard
# spec.template path, so the images: matcher above won't reach it. Patched
# explicitly instead.
patches:
  - target:
      kind: ScaledJob
      name: ingest-scaledjob
    patch: |-
      - op: replace
        path: /spec/jobTargetRef/template/spec/containers/0/image
        value: max76667/twitch-transcription-ingest:c14688a

  # The AWS box has 2 vCPUs: more than 2 whisper replicas just compete for the
  # same cores (and only as many replicas as there are busy streams can work
  # anyway), which made captions lag more, not less.
  - patch: |-
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: transcriber-scaledobject
        namespace: twitch-transcription
      spec:
        maxReplicaCount: 2

  # Measured with Grafana on this box: with two replicas on two vCPUs, the
  # "small" model with default thread pools took 4-9s per 4s chunk under load
  # (captions fell behind, ~4 in 10 chunks dropped). One thread per replica,
  # skipping silent audio and the "base" model brought it to ~1.1s with no
  # drops. Kustomize merges containers by name and env by variable name, so
  # this adds to the base env (KAFKA_BOOTSTRAP, CHUNK_SECONDS) without replacing it.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: transcriber
        namespace: twitch-transcription
      spec:
        template:
          spec:
            containers:
              - name: transcriber
                env:
                  - name: CPU_THREADS
                    value: "1"
                  - name: VAD_FILTER
                    value: "1"
                  - name: WHISPER_MODEL
                    value: base
